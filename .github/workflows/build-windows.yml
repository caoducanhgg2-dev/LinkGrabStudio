name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build and test
        shell: powershell
        run: .\build\build_windows.ps1

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path .\dist\LinkGrabStudio\* -DestinationPath .\dist\LinkGrabStudio_Portable_1.0.0-preview.1.zip -Force

      - name: Create checksums
        shell: powershell
        run: |
          Get-FileHash .\dist\installer\*.exe -Algorithm SHA256 | Format-Table -HideTableHeaders Hash,Path | Out-File .\dist\SHA256SUMS.txt
          Get-FileHash .\dist\*.zip -Algorithm SHA256 | Format-Table -HideTableHeaders Hash,Path | Out-File .\dist\SHA256SUMS.txt -Append

      - uses: actions/upload-artifact@v4
        with:
          name: LinkGrabStudio-Windows
          path: |
            dist/installer/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

