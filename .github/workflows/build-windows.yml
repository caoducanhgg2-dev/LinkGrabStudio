name: Build LinkGrab 1.3 Update

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate updater PowerShell syntax
        shell: powershell
        run: |
          $source = Get-Content .\build\Apply_Update_1.1.ps1 -Raw -Encoding UTF8
          [scriptblock]::Create($source) | Out-Null

      - name: Build and test
        shell: powershell
        run: .\build\build_windows.ps1 -SkipInstaller

      - name: Create small update ZIP
        shell: powershell
        run: .\build\make_update_patch.ps1 -Version "1.3.0"

      - uses: actions/upload-artifact@v4
        with:
          name: LinkGrabStudio-Update-1.3
          path: |
            dist/LinkGrabStudio_Update_1.3.0.zip
            dist/SHA256SUMS_UPDATE.txt
          if-no-files-found: error
